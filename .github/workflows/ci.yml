name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Smoke test the CLI
        run: |
          secretsweep --version
          secretsweep rules
          secretsweep scan examples/ -f json > /dev/null
          # examples/ intentionally contains findings, so check must fail (exit 1)
          if secretsweep check examples/; then
            echo "::error::expected findings in examples/, got none"
            exit 1
          fi
          echo "check correctly reported the sample findings"
