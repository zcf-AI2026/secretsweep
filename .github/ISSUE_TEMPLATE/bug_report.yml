name: Bug report
description: Something matched when it should not, or nothing matched when it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Do not paste real credentials, real IPs or customer data.**
        Reproduce with the documentation ranges (`192.0.2.x`, `198.51.100.x`,
        `203.0.113.x`) or the files in `examples/` instead.
  - type: input
    id: version
    attributes:
      label: secretsweep version
      description: Output of `secretsweep --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: 3.13.1 on macOS 15
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: secretsweep scan ./notes -c secretsweep.toml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      placeholder: |
        Expected ⟨PRIVATE_IP⟩ for 10.1.2.3.
        Actually nothing was reported.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config (optional)
      render: toml
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I removed all real secrets / personal data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
