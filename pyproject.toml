[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretsweep"
version = "0.1.0"
description = "Find and redact secrets, private IPs and other identifiers in notes and repos before they go public."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "secretsweep contributors" }]
keywords = ["secrets", "redaction", "sanitize", "privacy", "notes", "pre-commit", "obsidian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
secretsweep = "secretsweep.cli:main"

[project.urls]
Homepage = "https://github.com/zcf-AI2026/secretsweep"
Issues = "https://github.com/zcf-AI2026/secretsweep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secretsweep"]

[tool.hatch.build.targets.sdist]
include = ["src/secretsweep", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
